<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1034 626" width="1034" height="626" role="img" aria-label="Matriz de impacto y esfuerzo de las 13 oportunidades de mejora"><style>
  .ink{fill:#0b0b0b}.ink2{fill:#52514e}.bg{fill:#fcfcfb}.grid{stroke:#e4e3df}
  .s0{fill:#2a78d6}.s1{fill:#eb6834}.s2{fill:#1baf7a}.s3{fill:#eda100}.s4{fill:#e87ba4}
  .a0{fill:#2a78d6}.a1{fill:#eb6834}.a0s{stroke:#2a78d6}.a1s{stroke:#eb6834}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#f0efec}.ink2{fill:#c3c2b7}.bg{fill:#1a1a19}.grid{stroke:#383835}
    .s0{fill:#3987e5}.s1{fill:#d95926}.s2{fill:#199e70}.s3{fill:#c98500}.s4{fill:#d55181}
    .a0{fill:#3987e5}.a1{fill:#d95926}.a0s{stroke:#3987e5}.a1s{stroke:#d95926}
  }
</style>
<rect class="bg" width="1034" height="626" rx="8"/>
<text class="ink" x="16" y="28" font-size="16" font-weight="600">Oportunidades de mejora: impacto frente a esfuerzo</text>
<text class="ink2" x="16" y="50" font-size="12">Arriba a la izquierda, lo que más ayuda con menos trabajo. Cada etiqueta es una oportunidad de la sección 14 de la guía.</text>
<text class="ink" x="260.0" y="84" font-size="13" font-weight="600" text-anchor="middle">Esfuerzo bajo</text>
<text class="ink" x="560.0" y="84" font-size="13" font-weight="600" text-anchor="middle">Esfuerzo medio</text>
<text class="ink" x="860.0" y="84" font-size="13" font-weight="600" text-anchor="middle">Esfuerzo alto</text>
<text class="ink" x="96" y="211.0" font-size="13" font-weight="600" text-anchor="end">Impacto</text>
<text class="ink" x="96" y="228.0" font-size="13" font-weight="600" text-anchor="end">alto</text>
<rect class="a0" x="114" y="100" width="292" height="222" rx="8" fill-opacity="0.12" stroke="#c3c2b7" stroke-width="1"/>
<text class="ink" x="126" y="122" font-size="12" font-weight="700">Empezar aquí</text>
<rect class="a0" x="124" y="133" width="54" height="22" rx="11"/>
<text x="151" y="148" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-01</text>
<text class="ink" x="186" y="148" font-size="11">Reescribir la nota al revisor</text>
<rect class="a0" x="124" y="169" width="54" height="22" rx="11"/>
<text x="151" y="184" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-02</text>
<text class="ink" x="186" y="177" font-size="11">Juego de coordinación con</text>
<text class="ink" x="186" y="191" font-size="11">piezas existentes</text>
<rect class="a0" x="124" y="205" width="54" height="22" rx="11"/>
<text x="151" y="220" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-03</text>
<text class="ink" x="186" y="213" font-size="11">Pruebas con oráculo exacto</text>
<text class="ink" x="186" y="227" font-size="11">para cada certificado</text>
<rect class="grid" x="414" y="100" width="292" height="222" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<rect class="a0" x="424" y="133" width="54" height="22" rx="11"/>
<text x="451" y="148" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-09</text>
<text class="ink" x="486" y="141" font-size="11">Brecha derivada de un</text>
<text class="ink" x="486" y="155" font-size="11">mecanismo medible</text>
<rect class="a0" x="424" y="169" width="54" height="22" rx="11"/>
<text x="451" y="184" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-10</text>
<text class="ink" x="486" y="184" font-size="11">Prueba de profundidad y acceso</text>
<rect class="a0" x="424" y="205" width="54" height="22" rx="11"/>
<text x="451" y="220" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-13</text>
<text class="ink" x="486" y="213" font-size="11">Paquete para revisión humana</text>
<text class="ink" x="486" y="227" font-size="11">independiente</text>
<rect class="grid" x="714" y="100" width="292" height="222" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<rect class="a0" x="724" y="133" width="54" height="22" rx="11"/>
<text x="751" y="148" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-08</text>
<text class="ink" x="786" y="141" font-size="11">Comparadores que deciden con</text>
<text class="ink" x="786" y="155" font-size="11">lo que observan</text>
<text class="ink" x="96" y="441.0" font-size="13" font-weight="600" text-anchor="end">Impacto</text>
<text class="ink" x="96" y="458.0" font-size="13" font-weight="600" text-anchor="end">medio</text>
<rect class="grid" x="114" y="330" width="292" height="222" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<rect class="a0" x="124" y="363" width="54" height="22" rx="11"/>
<text x="151" y="378" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-05</text>
<text class="ink" x="186" y="371" font-size="11">Informar regiones, no un solo</text>
<text class="ink" x="186" y="385" font-size="11">caso</text>
<rect class="a0" x="124" y="399" width="54" height="22" rx="11"/>
<text x="151" y="414" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-06</text>
<text class="ink" x="186" y="414" font-size="11">Escala común declarada</text>
<rect class="a0" x="124" y="435" width="54" height="22" rx="11"/>
<text x="151" y="450" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-07</text>
<text class="ink" x="186" y="443" font-size="11">Todo número publicado sale de</text>
<text class="ink" x="186" y="457" font-size="11">una función</text>
<rect class="a0" x="124" y="471" width="54" height="22" rx="11"/>
<text x="151" y="486" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-11</text>
<text class="ink" x="186" y="479" font-size="11">Herramientas de auditoría en</text>
<text class="ink" x="186" y="493" font-size="11">la CI</text>
<rect class="a0" x="124" y="507" width="54" height="22" rx="11"/>
<text x="151" y="522" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-12</text>
<text class="ink" x="186" y="515" font-size="11">Decidir el idioma del</text>
<text class="ink" x="186" y="529" font-size="11">expediente</text>
<rect class="grid" x="414" y="330" width="292" height="222" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<rect class="a0" x="424" y="363" width="54" height="22" rx="11"/>
<text x="451" y="378" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">OP-04</text>
<text class="ink" x="486" y="371" font-size="11">Certificado B conjunto o</text>
<text class="ink" x="486" y="385" font-size="11">reserva de holgura</text>
<rect class="grid" x="714" y="330" width="292" height="222" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text class="ink2" x="16" y="610" font-size="11">Impacto y esfuerzo son estimaciones del auditor (IA) para ordenar el trabajo; no son mediciones.</text>
</svg>