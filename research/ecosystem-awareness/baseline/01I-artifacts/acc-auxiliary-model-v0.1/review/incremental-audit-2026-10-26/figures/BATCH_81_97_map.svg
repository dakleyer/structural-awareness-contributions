<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 656" width="1064" height="656" role="img" aria-label="Mapa de las 17 correcciones acotadas #81 a #97, su PR de base y la ronda de la auditoría que las recibió"><style>
  .ink{fill:#0b0b0b}.ink2{fill:#52514e}.bg{fill:#fcfcfb}.grid{stroke:#e4e3df}
