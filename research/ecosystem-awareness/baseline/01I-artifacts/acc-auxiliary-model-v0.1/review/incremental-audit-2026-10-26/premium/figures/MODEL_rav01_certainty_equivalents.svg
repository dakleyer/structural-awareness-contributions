<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Equivalentes ciertos de quedarse, rediseñar y defender en RAV-01"><style>
  .ink{fill:#0b0b0b}.ink2{fill:#52514e}.bg{fill:#fcfcfb}.card{fill:#f4f3f0;stroke:#d7d6d0}
  .line{stroke:#c3c2b7}.s0{fill:#2a78d6}.s1{fill:#eb6834}.s2{fill:#1baf7a}.s3{fill:#eda100}
  .s0s{stroke:#2a78d6}.s1s{stroke:#eb6834}.s2s{stroke:#1baf7a}.s3s{stroke:#eda100}
  text{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  @media (prefers-color-scheme: dark){
    .ink{fill:#f0efec}.ink2{fill:#c3c2b7}.bg{fill:#1a1a19}.card{fill:#262624;stroke:#3d3d3a}.line{stroke:#5a5a55}
    .s0{fill:#3987e5}.s1{fill:#d95926}.s2{fill:#199e70}.s3{fill:#c98500}
    .s0s{stroke:#3987e5}.s1s{stroke:#d95926}.s2s{stroke:#199e70}.s3s{stroke:#c98500}
  }
</style>
<rect class="bg" width="900" height="330" rx="10"/>
<text class="ink" x="24" y="34" font-size="18" font-weight="650">RAV-01: por qué quedarse puede ser racional aunque cambiar rinda más</text>
<text class="ink2" x="24" y="58" font-size="13">Equivalente cierto = media − penalización por riesgo (γ/2 · varianza, γ = 0,5) − coste. Testigo «tardío» de MODEL.md y #46.</text>
<text class="ink" x="138" y="118" font-size="13" font-weight="600" text-anchor="end">S · quedarse</text>
<rect class="s0" x="150" y="96" width="336.0" height="32" rx="4"><title>S · quedarse: equivalente cierto 13</title></rect>
<text x="160" y="117" font-size="12" font-weight="700" fill="#fff">CE 13</text>
<rect class="s1" x="488.0" y="96" width="24.0" height="32" rx="4" fill-opacity="0.85"/>
<text class="ink2" x="522.0" y="117" font-size="11">media 14</text>
<text class="ink" x="138" y="184" font-size="13" font-weight="600" text-anchor="end">R · rediseñar</text>
<rect class="s0" x="150" y="162" width="232.0" height="32" rx="4"><title>R · rediseñar: equivalente cierto 9</title></rect>
<text x="160" y="183" font-size="12" font-weight="700" fill="#fff">CE 9</text>
<rect class="s1" x="384.0" y="162" width="414.0" height="32" rx="4" fill-opacity="0.85"/>
<text x="392.0" y="183" font-size="11" font-weight="600" fill="#fff">riesgo −16</text>
<text class="ink2" x="808.0" y="183" font-size="11">media 25</text>
<text class="ink" x="138" y="250" font-size="13" font-weight="600" text-anchor="end">D · defender</text>
<rect class="s0" x="150" y="228" width="342.5" height="32" rx="4"><title>D · defender: equivalente cierto 13.25</title></rect>
<text x="160" y="249" font-size="12" font-weight="700" fill="#fff">CE 13,25</text>
<rect class="s1" x="494.5" y="228" width="4.5" height="32" rx="4" fill-opacity="0.85"/>
<rect class="s3" x="501.0" y="228" width="11.0" height="32" rx="4"/>
<text class="ink2" x="522.0" y="249" font-size="11">media 14 · coste 0,5 · riesgo 0,25</text>
<rect class="s0" x="24" y="290" width="14" height="14" rx="3"/>
<text class="ink" x="44" y="302" font-size="12">Equivalente cierto (lo que vale con seguridad)</text>
<rect class="s1" x="314" y="290" width="14" height="14" rx="3"/>
<text class="ink" x="334" y="302" font-size="12">Penalización por riesgo</text>
<rect class="s3" x="604" y="290" width="14" height="14" rx="3"/>
<text class="ink" x="624" y="302" font-size="12">Coste de defender</text>
<text class="ink2" x="24" y="322" font-size="11">Rediseñar tiene la media más alta (25) pero el menor equivalente cierto (9): su incertidumbre pesa más. Defender (13,25) supera a quedarse (13).</text>
</svg>