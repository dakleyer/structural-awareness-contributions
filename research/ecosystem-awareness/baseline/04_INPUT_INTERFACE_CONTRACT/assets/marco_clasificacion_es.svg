<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1160" viewBox="0 0 1000 1160"><rect width="1000" height="1160" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#566677"/></marker></defs><rect x="225" y="10" width="550" height="75" rx="8" fill="#F2F5F7" stroke="#778899" stroke-width="1.5"/><text x="250" y="42" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#111111">Proceso productor y perfil de referencia</text><text x="250" y="70" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Función, ámbito, momento y versión</text><path d="M380 85 V112 H220 V145" fill="none" stroke="#566677" stroke-width="2" marker-end="url(#arrow)"/><path d="M620 85 V112 H735 V145" fill="none" stroke="#566677" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="150" width="410" height="130" rx="8" fill="#EDF1F7" stroke="#778899" stroke-width="1.5"/><text x="40" y="183" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#111111">A  Resultado operativo</text><text x="40" y="216" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Llega a su consumidor habitual.</text><text x="40" y="245" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Su valor no entra en esta ruta</text><text x="40" y="274" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">de Ecosystem Awareness.</text><rect x="490" y="150" width="490" height="130" rx="8" fill="#EDF1F7" stroke="#778899" stroke-width="1.5"/><text x="510" y="183" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#111111">Información ya producida sobre A</text><text x="510" y="216" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Se separa por significado y ámbito.</text><text x="510" y="245" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">No exige nueva evaluación al productor.</text><text x="510" y="274" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">No reproduce el resultado operativo.</text><rect x="20" y="345" width="300" height="245" rx="8" fill="#EAF4F3" stroke="#778899" stroke-width="1.5"/><text x="38" y="380" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#111111">B  Calificación</text><text x="38" y="416" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">Significado, soporte,</text><text x="38" y="445" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">cobertura y límites</text><text x="38" y="474" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">ya establecidos sobre A.</text><text x="38" y="503" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111"></text><text x="38" y="532" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">Con su base y ámbito.</text><text x="38" y="561" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">Sin medida universal.</text><rect x="350" y="345" width="300" height="245" rx="8" fill="#FCF2E7" stroke="#778899" stroke-width="1.5"/><text x="368" y="380" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#111111">C  No examinado</text><text x="368" y="416" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">Posibilidad reconocida,</text><text x="368" y="445" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">vía de examen disponible</text><text x="368" y="474" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">y motivo de no usarla.</text><text x="368" y="503" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">Aportación todavía</text><text x="368" y="532" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">sin caracterización</text><text x="368" y="561" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">suficiente.</text><rect x="680" y="345" width="300" height="245" rx="8" fill="#FAECEC" stroke="#778899" stroke-width="1.5"/><text x="698" y="380" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#111111">D  Fuera de alcance</text><text x="698" y="416" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">Dependencia reconocida.</text><text x="698" y="445" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">Efecto no determinable</text><text x="698" y="474" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">dentro de la frontera.</text><text x="698" y="503" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">Límite y motivo.</text><text x="698" y="532" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">No poder actuar, por sí</text><text x="698" y="561" font-family="DejaVu Sans" font-size="20" font-weight="400" fill="#111111">solo, no la convierte en D.</text><path d="M735 280 V315 H170 V338" fill="none" stroke="#566677" stroke-width="2" marker-end="url(#arrow)"/><path d="M735 315 H500 V338" fill="none" stroke="#566677" stroke-width="2" marker-end="url(#arrow)"/><path d="M735 315 H830 V338" fill="none" stroke="#566677" stroke-width="2" marker-end="url(#arrow)"/><path d="M170 590 V620 H500 V651" fill="none" stroke="#566677" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 590 V651" fill="none" stroke="#566677" stroke-width="2" marker-end="url(#arrow)"/><path d="M830 590 V620 H500" fill="none" stroke="#566677" stroke-width="2" marker-end="url(#arrow)"/><rect x="240" y="655" width="520" height="65" rx="8" fill="#EAF0F8" stroke="#778899" stroke-width="1.5"/><text x="265" y="695" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#111111">Ecosystem Awareness recibe el EHD</text><text x="45" y="757" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Sólo las piezas disponibles e interpretables; una entrada puede contener varias.</text><text x="20" y="806" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#111111">Soporte y estado del intercambio  No son otros cuadrantes</text><rect x="20" y="832" width="300" height="115" rx="8" fill="#F8F8F8" stroke="#778899" stroke-width="1.5"/><text x="38" y="865" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#111111">Enlace</text><text x="38" y="900" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Identidad del evento,</text><text x="38" y="929" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">correlación y versión.</text><rect x="350" y="832" width="300" height="115" rx="8" fill="#F8F8F8" stroke="#778899" stroke-width="1.5"/><text x="368" y="865" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#111111">Configuración</text><text x="368" y="900" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Mandato para EA.</text><text x="368" y="929" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Fuera del descriptor.</text><rect x="680" y="832" width="300" height="115" rx="8" fill="#F8F8F8" stroke="#778899" stroke-width="1.5"/><text x="698" y="865" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#111111">Pendiente</text><text x="698" y="900" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Falta base para clasificar.</text><text x="698" y="929" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">No equivale a D.</text><text x="20" y="995" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#111111">La familia de interfaces es una clasificación distinta</text><text x="20" y="1030" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Si no encaja en O / IF-S, se declara familia no clasificada y se revisa el mapa.</text><text x="20" y="1059" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Eso no altera por sí solo B/C/D ni obliga a crear un nuevo cuadrante.</text><text x="20" y="1110" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#111111">Las palabras y el formato no deciden la categoría. El perfil aporta el contexto.</text></svg>