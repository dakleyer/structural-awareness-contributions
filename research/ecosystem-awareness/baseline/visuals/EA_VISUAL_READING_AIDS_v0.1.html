<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EA — visual reading aids</title><style>body{margin:0;background:#e9eef4;font-family:system-ui;color:#172d40}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:28px}p{line-height:1.5}svg{display:block;width:100%;height:auto;margin:24px 0;box-shadow:0 4px 20px #172d4015}a{color:#214f6b}@media print{body{background:white}main{padding:0}svg{break-after:page;box-shadow:none}}</style><main><h1>Ecosystem Awareness — visual reading aids</h1><p>Three selective overviews accompanying 00M v0.8 and 00N v0.7. The full definitions, evidence limits and requirement routes remain in the research notes.</p><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-labelledby="title-0 desc-0">
<title id="title-0">A/B/C/D: four relations to one process</title><desc id="desc-0">A selective reading aid. Roles depend on the producer, process, question, scope, capability and time. The full definitions in 00M govern interpretation.</desc>
<rect width="1200" height="1250" fill="#f7f9fc"/>
<text x="42" y="70.0" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#172d40">A/B/C/D: four relations to one process</text>
<text x="42" y="108.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#425669">Relative to producer, process, question, scope, capability and time.</text>
<text x="42" y="134.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#425669">These are components of a qualified position, not four exhaustive bins.</text>
<rect x="42" y="161" width="546" height="269" rx="12" fill="white" stroke="#214f6b" stroke-width="1.4"/>
<text x="64" y="194.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#214f6b">A</text>
<text x="64" y="226.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#214f6b">Result of active exploitation</text>
<text x="64" y="268.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">What the process actually delivers for the declared</text>
<text x="64" y="294.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">question. It can itself be a probability, interval or cost</text>
<text x="64" y="319.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">estimate when that is the function.</text>
<text x="64" y="357.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Recognition: what, precisely, did this process deliver as</text>
<text x="64" y="382.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">its result?</text>
<rect x="612" y="161" width="546" height="269" rx="12" fill="white" stroke="#08777b" stroke-width="1.4"/>
<text x="634" y="194.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#08777b">B</text>
<text x="634" y="226.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#08777b">Basis, limits and characterized reserve</text>
<text x="634" y="268.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Established support for A and an assessable remainder.</text>
<text x="634" y="294.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Further evaluation may remain unperformed even</text>
<text x="634" y="319.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">when its method and relevant effort are characterized.</text>
<text x="634" y="357.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Recognition: which question, variables and method</text>
<text x="634" y="382.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">make the qualification or further work assessable?</text>
<rect x="42" y="454" width="546" height="285" rx="12" fill="white" stroke="#915415" stroke-width="1.4"/>
<text x="64" y="487.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#915415">C</text>
<text x="64" y="519.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#915415">Exploration frontier</text>
<text x="64" y="561.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">A grounded avenue toward evaluation whose</text>
<text x="64" y="587.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">assessment basis is not yet available. No invented</text>
<text x="64" y="612.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">population, search cost, expected benefit or</text>
<text x="64" y="637.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">probability.</text>
<text x="64" y="675.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Recognition: is exploration grounded while the basis</text>
<text x="64" y="700.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">for a B-type calculation is missing?</text>
<rect x="612" y="454" width="546" height="285" rx="12" fill="white" stroke="#923c49" stroke-width="1.4"/>
<text x="634" y="487.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#923c49">D</text>
<text x="634" y="519.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#923c49">Residual beyond effective evaluation</text>
<text x="634" y="561.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">A potentially material effect beyond this process’s</text>
<text x="634" y="587.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">effective evaluation routes. Some factors can be</text>
<text x="634" y="612.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">named or monitored; the full residual cannot be</text>
<text x="634" y="637.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">enumerated.</text>
<text x="634" y="675.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Recognition: could this matter while its effect remains</text>
<text x="634" y="700.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">beyond evaluation under current conditions?</text>
<rect x="42" y="763" width="1116" height="149" rx="12" fill="#eaf0f7" stroke="#cad5df" stroke-width="1.4"/>
<text x="64" y="802.0" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#172d40">Three boundaries, three different questions</text>
<text x="64" y="839.8" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">A / B: the function of the assertion, not its datatype.</text>
<text x="64" y="866.4" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">B / C: a characterized evaluation basis versus a grounded exploration frontier.</text>
<text x="64" y="893.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">C / D: a route toward evaluation versus a current effective evaluation barrier.</text>
<rect x="42" y="932" width="1116" height="107" rx="12" fill="white" stroke="#cad5df" stroke-width="1.4"/>
<text x="64" y="967.0" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#172d40">Exploitation produces A · Evaluation applies an established frame · Exploration develops one</text>
<text x="64" y="1001.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">An evaluation or exploration process can deliver its own A. Learning enough to assess one C aspect can qualify that</text>
<text x="64" y="1026.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">aspect as B; the open frontier remains.</text>
<rect x="42" y="1059" width="1116" height="117" rx="12" fill="#eaf0f7" stroke="#cad5df" stroke-width="1.4"/>
<text x="64" y="1094.0" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#172d40">UNKNOWN: the role is not established</text>
<text x="64" y="1128.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Not a fifth substantive region, and distinct from the producer’s kind being unknown. Another actor may have A or B</text>
<text x="64" y="1153.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">for this scope, but mapping that relation does not itself create access or close a gap.</text>
<a href="https://github.com/dakleyer/structural-awareness-contributions/blob/main/research/ecosystem-awareness/baseline/00M_ABCD_AND_MATHEMATICAL_PLAUSIBILITY_v0.8_RESEARCH_NOTE.md#abcd-canonical"><text x="42" y="1217.0" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#425669">Selective overview · 00M v0.8, §§1.1–1.7 · Full definitions and conditions remain in the research note.</text></a>
</svg><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title-1 desc-1">
<title id="title-1">Four mathematical tasks for composing partial views</title><desc id="desc-1">Four operations with distinct mathematical precedents and limits. Logical dependencies are shown through the shared qualification conditions, not as a mandatory serial execution protocol.</desc>
<rect width="1200" height="1140" fill="#f7f9fc"/>
<text x="42" y="70.0" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#172d40">Four mathematical tasks for composing partial views</text>
<text x="42" y="108.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#425669">Each operation needs both a representation and a limit on inference.</text>
<text x="42" y="134.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#425669">The numbering follows the argument; it does not prescribe a serial implementation.</text>
<rect x="42" y="161" width="546" height="274" rx="12" fill="white" stroke="#214f6b" stroke-width="1.4"/>
<text x="64" y="194.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#214f6b">01 · INTERPRET ROLES</text>
<text x="64" y="226.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#214f6b">Recognize A/B/C/D</text>
<text x="64" y="268.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Qualified assertions relative to a declared process and</text>
<text x="64" y="294.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">frame can represent the four functional roles.</text>
<text x="64" y="332.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Limit: producer meaning, capability and evidence are</text>
<text x="64" y="357.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">needed. Open C/D cannot be exhaustively classified.</text>
<text x="64" y="382.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">[§3.1]</text>
<rect x="612" y="161" width="546" height="274" rx="12" fill="white" stroke="#08777b" stroke-width="1.4"/>
<text x="634" y="194.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#08777b">02 · RELATE SCOPES</text>
<text x="634" y="226.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#08777b">Justify the correspondence</text>
<text x="634" y="268.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Typed contexts and partial maps can represent where</text>
<text x="634" y="294.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">declarations admit a common question.</text>
<text x="634" y="332.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Limit: a common label or MSCA is not enough.</text>
<text x="634" y="357.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Cockett–Lack represents partiality; semantic validity</text>
<text x="634" y="382.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">needs separate grounds. [§3.2]</text>
<rect x="42" y="459" width="546" height="299" rx="12" fill="white" stroke="#915415" stroke-width="1.4"/>
<text x="64" y="492.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#915415">03 · COMPOSE SUMMARIES</text>
<text x="64" y="524.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#915415">Preserve a useful distinction</text>
<text x="64" y="566.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Task-relative abstraction can support exact answers or</text>
<text x="64" y="592.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">sound conservative answer sets. Attributed</text>
<text x="64" y="617.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">aggregation can retain distinct declarations.</text>
<text x="64" y="655.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Limit: convergence is not truth or source</text>
<text x="64" y="680.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">independence. Streaming-space bounds are not</text>
<text x="64" y="705.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">communication bounds. Total cost remains open. [§4]</text>
<rect x="612" y="459" width="546" height="299" rx="12" fill="white" stroke="#923c49" stroke-width="1.4"/>
<text x="634" y="492.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#923c49">04 · REQUALIFY</text>
<text x="634" y="524.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#923c49">Give a property-specific direction</text>
<text x="634" y="566.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Versioned judgments, partial orders and signed</text>
<text x="634" y="592.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">comparisons of warranted bounds can express</text>
<text x="634" y="617.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">contextual change.</text>
<text x="634" y="655.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Limit: requalification needs grounds. Increased</text>
<text x="634" y="680.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">assessability need not mean lower risk; a direction is</text>
<text x="634" y="705.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">not a universal A/B/C/D score. [§6]</text>
<rect x="42" y="782" width="1116" height="128" rx="12" fill="#eaf0f7" stroke="#cad5df" stroke-width="1.4"/>
<text x="64" y="820.0" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#172d40">The conditions must survive composition</text>
<text x="64" y="859.8" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">The receiving review still needs compatible scope, interpretation, provenance and current grounds. Success in</text>
<text x="64" y="886.4" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">one operation cannot compensate for a missing correspondence or qualification in another.</text>
<rect x="42" y="934" width="1116" height="126" rx="12" fill="white" stroke="#cad5df" stroke-width="1.4"/>
<text x="64" y="972.0" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#172d40">The bounded opportunity</text>
<text x="64" y="1009.8" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">Compatible metadata may expose a changed basis for collective reliance that operative outputs conceal. Useful</text>
<text x="64" y="1036.4" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">requalification also requires those distinctions to survive composition and arrive in time.</text>
<a href="https://github.com/dakleyer/structural-awareness-contributions/blob/main/research/ecosystem-awareness/baseline/00M_ABCD_AND_MATHEMATICAL_PLAUSIBILITY_v0.8_RESEARCH_NOTE.md#abcd-canonical"><text x="42" y="1107.0" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#425669">Selective overview · 00M v0.8, §§3–7; 00N v0.7, §§1.3, 3.2 · Plausibility is not engineering feasibility.</text></a>
</svg><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1505" viewBox="0 0 1200 1505" role="img" aria-labelledby="title-2 desc-2">
<title id="title-2">From the mechanism to the requirements</title><desc id="desc-2">A selective overview of conditional contributions to T1–T4, timing, selected requirement families and H1–H6. It makes no conformance or measurement claim.</desc>
<rect width="1200" height="1505" fill="#f7f9fc"/>
<text x="42" y="70.0" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#172d40">From the mechanism to the requirements</text>
<text x="42" y="108.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#425669">Plausible contributions, with their remaining obligations.</text>
<text x="42" y="134.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#425669">The strongest direct support concerns bounded parts of T1 and T2.</text>
<rect x="42" y="161" width="546" height="274" rx="12" fill="white" stroke="#214f6b" stroke-width="1.4"/>
<text x="64" y="194.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#214f6b">T1 · MATERIAL AWARENESS</text>
<text x="64" y="226.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#214f6b">Within a declared boundary</text>
<text x="64" y="268.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Scope-aligned metadata may expose an expired</text>
<text x="64" y="294.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">assumption, incompatible basis or lost assessment</text>
<text x="64" y="319.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">capability concealed by operative outputs.</text>
<text x="64" y="357.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Still needed: a material target, detectable change</text>
<text x="64" y="382.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">family, justified interpretation and explicit blind spots.</text>
<rect x="612" y="161" width="546" height="274" rx="12" fill="white" stroke="#08777b" stroke-width="1.4"/>
<text x="634" y="194.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#08777b">T2 · QUALIFIED DETERMINATION</text>
<text x="634" y="226.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#08777b">Owner-preserving handoff</text>
<text x="634" y="268.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Preserve grounds and unresolved alternatives; support</text>
<text x="634" y="294.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">a posture to continue, requalify, contain/hold, escalate</text>
<text x="634" y="319.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">or preserve UNKNOWN.</text>
<text x="634" y="357.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Still needed: current owner, dependencies,</text>
<text x="634" y="382.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">authority/capacity limits, expiry, re-entry and valid</text>
<text x="634" y="407.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">sources for the handoff.</text>
<rect x="42" y="459" width="546" height="300" rx="12" fill="white" stroke="#915415" stroke-width="1.4"/>
<text x="64" y="492.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#915415">T3 · BOUNDED AND AUTHORIZED</text>
<text x="64" y="524.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#915415">Response remains a coupled obligation</text>
<text x="64" y="566.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">The mechanism can identify a limit, preserve</text>
<text x="64" y="592.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">authorization needs and support a bounded candidate</text>
<text x="64" y="617.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">position.</text>
<text x="64" y="655.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Still needed: legitimate owner, permitted actions,</text>
<text x="64" y="680.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">reversibility and downside conditions—including the</text>
<text x="64" y="705.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">per-state no-worse-than-null-action guarantee.</text>
<text x="64" y="731.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Metadata alone cannot establish these.</text>
<rect x="612" y="459" width="546" height="300" rx="12" fill="white" stroke="#915415" stroke-width="1.4"/>
<text x="634" y="492.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#915415">T4 · TIMELY AND VIABLE</text>
<text x="634" y="524.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#915415">Minimum-sufficient requalification</text>
<text x="634" y="566.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Targeted summaries make bounded effort conceivable</text>
<text x="634" y="592.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">without reconstructing every source state.</text>
<text x="634" y="630.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Still needed: total costs, response margins, useful</text>
<text x="634" y="655.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">stopping rules and resilience to saturation and</text>
<text x="634" y="680.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">oscillation. Communication savings alone do not</text>
<text x="634" y="705.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">establish viability.</text>
<rect x="42" y="783" width="1116" height="142" rx="12" fill="#eaf0f7" stroke="#cad5df" stroke-width="1.4"/>
<text x="64" y="821.0" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#172d40">An illustrative sufficient timing condition — serial case</text>
<text x="64" y="861.8" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#172d40">t_available + τ_qualification + τ_response &lt; t_last useful response</text>
<text x="64" y="898.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Concurrent paths need their actual elapsed-time bound. Qualification must remain applicable when the response acts.</text>

<text x="64" y="1025.8" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">S3 / S10: review changed applicability and commitments; cancellation or new authority is not supplied by the</text>

<text x="64" y="1079.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">S5 / S14: preserve indeterminacy; UNKNOWN is not automatic global containment.</text>
<text x="64" y="1105.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">S9 / S11: preserve qualified scopes and dependencies; different reports need not be independent.</text>
<text x="64" y="1138.2" font-family="DejaVu Sans" font-size="17" font-weight="400" fill="#425669">These are selected routes. The remaining requirement families and full boundaries are in 00N §3.4.</text>

<text x="64" y="1227.0" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#172d40">The existing six hypotheses remain distinct</text>
<text x="64" y="1266.8" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">H1 preserves insufficient determination within window U. H2 separates confidence conditional on U from the</text>

<text x="64" y="1320.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">H3 concerns hidden qualifications and false confidence under composition. H4 asks whether enough context</text>

<text x="64" y="1373.2" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">H5 concerns freshness and dependency churn. H6 concerns the risk/resource trade-off of window selection.</text>
