<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-labelledby="title desc">
<title id="title">A/B/C/D: four relations to one process</title><desc id="desc">A selective reading aid. Roles depend on the producer, process, question, scope, capability and time. The full definitions in 00M govern interpretation.</desc>
<rect width="1200" height="1250" fill="#f7f9fc"/>
<text x="42" y="70.0" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#172d40">A/B/C/D: four relations to one process</text>
<text x="42" y="108.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#425669">Relative to producer, process, question, scope, capability and time.</text>
<text x="42" y="134.6" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#425669">These are components of a qualified position, not four exhaustive bins.</text>
<rect x="42" y="161" width="546" height="269" rx="12" fill="white" stroke="#214f6b" stroke-width="1.4"/>
<text x="64" y="194.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#214f6b">A</text>
<text x="64" y="226.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#214f6b">Result of active exploitation</text>
<text x="64" y="268.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">What the process actually delivers for the declared</text>
<text x="64" y="294.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">question. It can itself be a probability, interval or cost</text>
<text x="64" y="319.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">estimate when that is the function.</text>
<text x="64" y="357.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Recognition: what, precisely, did this process deliver as</text>
<text x="64" y="382.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">its result?</text>
<rect x="612" y="161" width="546" height="269" rx="12" fill="white" stroke="#08777b" stroke-width="1.4"/>
<text x="634" y="194.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#08777b">B</text>
<text x="634" y="226.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#08777b">Basis, limits and characterized reserve</text>
<text x="634" y="268.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Established support for A and an assessable remainder.</text>
<text x="634" y="294.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Further evaluation may remain unperformed even</text>
<text x="634" y="319.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">when its method and relevant effort are characterized.</text>
<text x="634" y="357.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Recognition: which question, variables and method</text>
<text x="634" y="382.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">make the qualification or further work assessable?</text>
<rect x="42" y="454" width="546" height="285" rx="12" fill="white" stroke="#915415" stroke-width="1.4"/>
<text x="64" y="487.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#915415">C</text>
<text x="64" y="519.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#915415">Exploration frontier</text>
<text x="64" y="561.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">A grounded avenue toward evaluation whose</text>
<text x="64" y="587.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">assessment basis is not yet available. No invented</text>
<text x="64" y="612.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">population, search cost, expected benefit or</text>
<text x="64" y="637.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">probability.</text>
<text x="64" y="675.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Recognition: is exploration grounded while the basis</text>
<text x="64" y="700.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">for a B-type calculation is missing?</text>
<rect x="612" y="454" width="546" height="285" rx="12" fill="white" stroke="#923c49" stroke-width="1.4"/>
<text x="634" y="487.0" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#923c49">D</text>
<text x="634" y="519.4" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#923c49">Residual beyond effective evaluation</text>
<text x="634" y="561.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">A potentially material effect beyond this process’s</text>
<text x="634" y="587.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">effective evaluation routes. Some factors can be</text>
<text x="634" y="612.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">named or monitored; the full residual cannot be</text>
<text x="634" y="637.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">enumerated.</text>
<text x="634" y="675.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">Recognition: could this matter while its effect remains</text>
<text x="634" y="700.8" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#425669">beyond evaluation under current conditions?</text>
<rect x="42" y="763" width="1116" height="149" rx="12" fill="#eaf0f7" stroke="#cad5df" stroke-width="1.4"/>
<text x="64" y="802.0" font-family="DejaVu Sans" font-size="22" font-weight="700" fill="#172d40">Three boundaries, three different questions</text>
<text x="64" y="839.8" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">A / B: the function of the assertion, not its datatype.</text>
<text x="64" y="866.4" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">B / C: a characterized evaluation basis versus a grounded exploration frontier.</text>
<text x="64" y="893.0" font-family="DejaVu Sans" font-size="19" font-weight="400" fill="#172d40">C / D: a route toward evaluation versus a current effective evaluation barrier.</text>
<rect x="42" y="932" width="1116" height="107" rx="12" fill="white" stroke="#cad5df" stroke-width="1.4"/>
<text x="64" y="967.0" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#172d40">Exploitation produces A · Evaluation applies an established frame · Exploration develops one</text>
<text x="64" y="1001.0" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">An evaluation or exploration process can deliver its own A. Learning enough to assess one C aspect can qualify that</text>
<text x="64" y="1026.2" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">aspect as B; the open frontier remains.</text>
<rect x="42" y="1059" width="1116" height="117" rx="12" fill="#eaf0f7" stroke="#cad5df" stroke-width="1.4"/>
<text x="64" y="1094.0" font-family="DejaVu Sans" font-size="21" font-weight="700" fill="#172d40">UNKNOWN: the role is not established</text>
<text x="64" y="1128.4" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">Not a fifth substantive region, and distinct from the producer’s kind being unknown. Another actor may have A or B</text>
<text x="64" y="1153.6" font-family="DejaVu Sans" font-size="18" font-weight="400" fill="#172d40">for this scope, but mapping that relation does not itself create access or close a gap.</text>
<text x="42" y="1217.0" font-family="DejaVu Sans" font-size="16" font-weight="400" fill="#425669">Selective overview · 00M v0.8, §§1.1–1.7 · Full definitions and conditions remain in the research note.</text>
</svg>