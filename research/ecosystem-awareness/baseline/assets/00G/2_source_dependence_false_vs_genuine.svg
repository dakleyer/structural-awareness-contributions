<svg width="1300" height="560" viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
<rect width="1300" height="560" fill="#F7F8FA"/>
<text x="40" y="45" font-size="24" font-weight="bold" fill="#1F2C4A">Messages are not evidence paths</text>
<text x="40" y="70" font-size="14" fill="#5D6572">Matched topology and message count — what differs is the evidence and authority behind them.</text>

<!-- Left: Branch F false -->
<rect x="40" y="100" width="580" height="45" rx="8" fill="#B33A3A"/>
<text x="330" y="128" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">Branch F — false convergence</text>

<g font-size="13">
<rect x="60" y="170" width="150" height="55" rx="8" fill="#FFFFFF" stroke="#1F2C4A" stroke-width="1.3"/>
<text x="135" y="203" text-anchor="middle" font-weight="bold" fill="#1F2C4A">SRC_1</text>

<line x1="210" y1="197" x2="255" y2="197" stroke="#5D6572" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="260" y="170" width="120" height="55" rx="8" fill="#FFFFFF" stroke="#1F2C4A" stroke-width="1.3"/>
<text x="320" y="203" text-anchor="middle" font-weight="bold" fill="#1F2C4A">N</text>

<line x1="380" y1="197" x2="425" y2="197" stroke="#B33A3A" stroke-width="1.8" marker-end="url(#arrowred)"/>
<rect x="430" y="130" width="120" height="55" rx="8" fill="#FFFFFF" stroke="#1F2C4A" stroke-width="1.3"/>
<text x="490" y="163" text-anchor="middle" font-weight="bold" fill="#1F2C4A">R1</text>

<line x1="490" y1="185" x2="490" y2="207" stroke="#B33A3A" stroke-width="1.8" marker-end="url(#arrowred)"/>
<rect x="430" y="212" width="120" height="55" rx="8" fill="#FFFFFF" stroke="#1F2C4A" stroke-width="1.3"/>
<text x="490" y="245" text-anchor="middle" font-weight="bold" fill="#1F2C4A">R2</text>

<text x="335" y="290" text-anchor="middle" fill="#5D6572" font-size="12">R1 and R2 inherit the same upstream evidence from N</text>
</g>

<rect x="60" y="320" width="530" height="90" rx="8" fill="#FBECEA" stroke="#B33A3A" stroke-width="1.5"/>
<text x="325" y="348" text-anchor="middle" fill="#B33A3A" font-weight="bold" font-size="14">3 messages · 3 signed identities</text>
<text x="325" y="372" text-anchor="middle" fill="#B33A3A" font-weight="bold" font-size="16">= 1 independent evidence path</text>
<text x="325" y="395" text-anchor="middle" fill="#722" font-size="12">counting this as 3 is false corroboration</text>

<!-- Right: Branch G genuine -->
<rect x="680" y="100" width="580" height="45" rx="8" fill="#007B82"/>
<text x="970" y="128" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">Branch G — genuine regime change</text>

<g font-size="13">
<rect x="700" y="130" width="120" height="55" rx="8" fill="#FFFFFF" stroke="#1F2C4A" stroke-width="1.3"/>
<text x="760" y="163" text-anchor="middle" font-weight="bold" fill="#1F2C4A">SRC_1</text>
<line x1="820" y1="157" x2="860" y2="157" stroke="#5D6572" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="700" y="212" width="120" height="55" rx="8" fill="#FFFFFF" stroke="#1F2C4A" stroke-width="1.3"/>
<text x="760" y="245" text-anchor="middle" font-weight="bold" fill="#1F2C4A">SRC_2</text>
<line x1="820" y1="240" x2="860" y2="240" stroke="#5D6572" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="700" y="294" width="120" height="55" rx="8" fill="#FFFFFF" stroke="#1F2C4A" stroke-width="1.3"/>
<text x="760" y="327" text-anchor="middle" font-weight="bold" fill="#1F2C4A">SRC_3</text>
<line x1="820" y1="321" x2="860" y2="321" stroke="#5D6572" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="865" y="130" width="120" height="55" rx="8" fill="#FFFFFF" stroke="#1F2C4A" stroke-width="1.3"/>
<text x="925" y="163" text-anchor="middle" font-weight="bold" fill="#1F2C4A">N</text>

<rect x="865" y="212" width="120" height="55" rx="8" fill="#FFFFFF" stroke="#1F2C4A" stroke-width="1.3"/>
<text x="925" y="245" text-anchor="middle" font-weight="bold" fill="#1F2C4A">R1</text>

<rect x="865" y="294" width="120" height="55" rx="8" fill="#FFFFFF" stroke="#1F2C4A" stroke-width="1.3"/>
<text x="925" y="327" text-anchor="middle" font-weight="bold" fill="#1F2C4A">R2</text>

<text x="970" y="375" text-anchor="middle" fill="#5D6572" font-size="12">Each identity has its own, separate source</text>
</g>

<rect x="700" y="405" width="530" height="90" rx="8" fill="#E6F4F0" stroke="#007B82" stroke-width="1.5"/>
<text x="965" y="433" text-anchor="middle" fill="#007B82" font-weight="bold" font-size="14">3 messages · 3 signed identities</text>
<text x="965" y="457" text-anchor="middle" fill="#007B82" font-weight="bold" font-size="16">= 3 independent evidence paths</text>
<text x="965" y="478" text-anchor="middle" fill="#0a5a5c" font-size="11">independence supports corroboration; it does not itself authorize change</text>
<text x="965" y="493" text-anchor="middle" fill="#0a5a5c" font-size="11">Branch G also requires applicable mission-transition authority</text>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5D6572" stroke-width="1.6"/>
  </marker>
  <marker id="arrowred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#B33A3A" stroke-width="1.8"/>
  </marker>
</defs>
</svg>