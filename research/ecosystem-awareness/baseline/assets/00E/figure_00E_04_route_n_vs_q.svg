<svg width="1300" height="720" viewBox="0 0 1300 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif"><rect width="1300" height="720" fill="#F7F8FA"/><text x="40" y="45" font-size="24" fill="#1F2C4A" font-weight="bold" text-anchor="start">Figure 00E-4 — Route N versus Route Q under the same 100-million-token ceiling</text><text x="40" y="70" font-size="14" fill="#5D6572" font-weight="normal" text-anchor="start">Same fictional company, facts, tools, human-review capacity and deadline; only the quality discipline differs.</text><rect x="40" y="88" width="1220" height="46" rx="7" fill="#FFFFFF" stroke="#C8CDD6" stroke-width="1"/><text x="650" y="107" font-size="12" fill="#1F2C4A" font-weight="bold" text-anchor="middle">Q0 — common start</text><text x="650" y="124" font-size="10.8" fill="#5D6572" font-weight="normal" text-anchor="middle">Route N fails to bound scope / stop rules; Route Q fixes scopes, resource ledger, deadlines, dependencies and null actions before work begins.</text><rect x="40" y="150" width="600" height="44" rx="7" fill="#B33A3A" stroke="#B33A3A" stroke-width="0"/><text x="340" y="178" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Route N — requirements not satisfied for the run</text><rect x="660" y="150" width="600" height="44" rx="7" fill="#007B82" stroke="#007B82" stroke-width="0"/><text x="960" y="178" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Route Q — requirements satisfied for the run</text><rect x="40" y="205" width="600" height="78" rx="6" fill="#FBECEA" stroke="#B33A3A" stroke-width="1"/><text x="55" y="226" font-size="11.5" fill="#B33A3A" font-weight="bold" text-anchor="start">Q1 · production / execution</text><text x="55" y="247" font-size="10.7" fill="#5D6572" font-weight="normal" text-anchor="start">winner + binary state; qualification discarded</text><text x="55" y="265" font-size="10.7" fill="#B33A3A" font-weight="bold" text-anchor="start">I2 enters the enterprise picture</text><rect x="660" y="205" width="600" height="78" rx="6" fill="#E6F4F0" stroke="#007B82" stroke-width="1"/><text x="675" y="226" font-size="11.5" fill="#007B82" font-weight="bold" text-anchor="start">Q1 · production / execution</text><text x="675" y="247" font-size="10.7" fill="#5D6572" font-weight="normal" text-anchor="start">winner + bounded qualification envelope</text><text x="675" y="265" font-size="10.7" fill="#007B82" font-weight="bold" text-anchor="start">uncertainty, scope, dependencies and reopening links preserved</text><rect x="40" y="291" width="600" height="78" rx="6" fill="#FBECEA" stroke="#B33A3A" stroke-width="1"/><text x="55" y="312" font-size="11.5" fill="#B33A3A" font-weight="bold" text-anchor="start">Q2 · quality control / human</text><text x="55" y="333" font-size="10.7" fill="#5D6572" font-weight="normal" text-anchor="start">binary tickets; discarded state cannot be reopened</text><text x="55" y="351" font-size="10.7" fill="#B33A3A" font-weight="bold" text-anchor="start">I1 / overload; inherited I2 may receive approval</text><rect x="660" y="291" width="600" height="78" rx="6" fill="#E6F4F0" stroke="#007B82" stroke-width="1"/><text x="675" y="312" font-size="11.5" fill="#007B82" font-weight="bold" text-anchor="start">Q2 · quality control / human</text><text x="675" y="333" font-size="10.7" fill="#5D6572" font-weight="normal" text-anchor="start">reopen only material assumptions; bounded human posture</text><text x="675" y="351" font-size="10.7" fill="#007B82" font-weight="bold" text-anchor="start">qualified alternatives and remaining response time remain visible</text><rect x="40" y="377" width="600" height="78" rx="6" fill="#FBECEA" stroke="#B33A3A" stroke-width="1"/><text x="55" y="398" font-size="11.5" fill="#B33A3A" font-weight="bold" text-anchor="start">Q3 · strategy / creativity</text><text x="55" y="419" font-size="10.7" fill="#5D6572" font-weight="normal" text-anchor="start">possibility promoted because it is articulate / attractive</text><text x="55" y="437" font-size="10.7" fill="#B33A3A" font-weight="bold" text-anchor="start">O2 — possibility treated as sufficiently supported</text><rect x="660" y="377" width="600" height="78" rx="6" fill="#E6F4F0" stroke="#007B82" stroke-width="1"/><text x="675" y="398" font-size="11.5" fill="#007B82" font-weight="bold" text-anchor="start">Q3 · strategy / creativity</text><text x="675" y="419" font-size="10.7" fill="#5D6572" font-weight="normal" text-anchor="start">ideas remain hypotheses until their own evidence and limits pass</text><text x="675" y="437" font-size="10.7" fill="#007B82" font-weight="bold" text-anchor="start">unsupported ideas stay in C rather than entering A</text><rect x="40" y="463" width="600" height="78" rx="6" fill="#FBECEA" stroke="#B33A3A" stroke-width="1"/><text x="55" y="484" font-size="11.5" fill="#B33A3A" font-weight="bold" text-anchor="start">Q4 · deployment / BD</text><text x="55" y="505" font-size="10.7" fill="#5D6572" font-weight="normal" text-anchor="start">complete market knowledge demanded before action</text><text x="55" y="523" font-size="10.7" fill="#B33A3A" font-weight="bold" text-anchor="start">O1 — unlimited search / terminal HOLD</text><rect x="660" y="463" width="600" height="78" rx="6" fill="#E6F4F0" stroke="#007B82" stroke-width="1"/><text x="675" y="484" font-size="11.5" fill="#007B82" font-weight="bold" text-anchor="start">Q4 · deployment / BD</text><text x="675" y="505" font-size="10.7" fill="#5D6572" font-weight="normal" text-anchor="start">learnable uncertainty separated from unresolved / structural residual</text><text x="675" y="523" font-size="10.7" fill="#007B82" font-weight="bold" text-anchor="start">bounded experiment, contain, proceed-under-limits or no commitment</text><rect x="40" y="549" width="600" height="78" rx="6" fill="#FBECEA" stroke="#B33A3A" stroke-width="1"/><text x="55" y="570" font-size="11.5" fill="#B33A3A" font-weight="bold" text-anchor="start">Q5 · enterprise composition</text><text x="55" y="591" font-size="10.7" fill="#5D6572" font-weight="normal" text-anchor="start">four incompatible states narrated as checks and balances</text><text x="55" y="609" font-size="10.7" fill="#B33A3A" font-weight="bold" text-anchor="start">FAIL — contradiction propagated, not cancelled</text><rect x="660" y="549" width="600" height="78" rx="6" fill="#E6F4F0" stroke="#007B82" stroke-width="1"/><text x="675" y="570" font-size="11.5" fill="#007B82" font-weight="bold" text-anchor="start">Q5 · enterprise composition</text><text x="675" y="591" font-size="10.7" fill="#5D6572" font-weight="normal" text-anchor="start">only evidenced dependencies composed under declared arbitration</text><text x="675" y="609" font-size="10.7" fill="#007B82" font-weight="bold" text-anchor="start">PASS / explicit limit / no-conclusion, with unresolved scopes preserved</text><rect x="40" y="645" width="1220" height="52" rx="7" fill="#1F2C4A" stroke="#1F2C4A" stroke-width="0"/><text x="650" y="668" font-size="12.5" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Route Q does not promise a successful China entry or an error-free world model.</text><text x="650" y="686" font-size="12" fill="#FFFFFF" font-weight="normal" text-anchor="middle">It promises a qualified, bounded and timely posture without manufacturing Type 1 or Type 2 through its own management.</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5D6572" stroke-width="1.6"/></marker></defs></svg>