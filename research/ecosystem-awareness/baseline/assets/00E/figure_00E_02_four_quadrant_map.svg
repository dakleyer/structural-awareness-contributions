<svg width="1200" height="705" viewBox="0 0 1200 705" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif"><rect width="1200" height="705" fill="#F7F8FA"/><text x="40" y="45" font-size="24" fill="#1F2C4A" font-weight="bold" text-anchor="start">Figure 00E-2 — Four-quadrant map around the bounded working universe U = W(d,t)</text><text x="40" y="70" font-size="14" fill="#5D6572" font-weight="normal" text-anchor="start">Exact 00E pole semantics; the diagram does not replace the table in §3.</text><rect x="875" y="35" width="285" height="46" rx="6" fill="#FFFFFF" stroke="#C8CDD6" stroke-width="1"/><text x="1018" y="54" font-size="12" fill="#1F2C4A" font-weight="bold" text-anchor="middle">U = W(d,t)</text><text x="1018" y="70" font-size="10.5" fill="#5D6572" font-weight="normal" text-anchor="middle">bounded working universe for the material decision</text><text x="330" y="110" font-size="12.5" fill="#5D6572" font-weight="bold" text-anchor="middle">treated as settled → Type-2 pressure</text><text x="870" y="110" font-size="12.5" fill="#5D6572" font-weight="bold" text-anchor="middle">treated as open → Type-1 pressure</text><text x="20" y="245" font-size="12.5" fill="#5D6572" font-weight="bold" transform="rotate(-90 20 245)">Inside U (in-window)</text><text x="20" y="575" font-size="12.5" fill="#5D6572" font-weight="bold" transform="rotate(-90 20 575)">Beyond U (out-of-window)</text><rect x="60" y="125" width="540" height="235" rx="10" fill="#FBECEA" stroke="#B33A3A" stroke-width="1.5"/><text x="80" y="155" font-size="14" fill="#B33A3A" font-weight="bold" text-anchor="start">Pole A · what the system treats as known</text><text x="80" y="183" font-size="11" fill="#5D6572" font-weight="normal" text-anchor="start">Correct: bounded determination only inside declared evidence and scope.</text><text x="80" y="212" font-size="11" fill="#B33A3A" font-weight="bold" text-anchor="start">Meridian: local best answers become broader certainty after qualification is removed.</text><rect x="80" y="260" width="245" height="70" rx="8" fill="#FFFFFF" stroke="#B33A3A" stroke-width="1"/><text x="202.5" y="288" font-size="11.5" fill="#B33A3A" font-weight="bold" text-anchor="middle">I2 — in-window Type 2 false certainty</text><text x="202.5" y="309" font-size="10" fill="#5D6572" font-weight="normal" text-anchor="middle">failure position</text><rect x="340" y="260" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#B33A3A" stroke-width="1"/><text x="460" y="288" font-size="11.5" fill="#1F2C4A" font-weight="bold" text-anchor="middle">Production / execution</text><text x="460" y="309" font-size="10" fill="#5D6572" font-weight="normal" text-anchor="middle">primary business subsystem</text><rect x="600" y="125" width="540" height="235" rx="10" fill="#FFF4E9" stroke="#C17629" stroke-width="1.5"/><text x="620" y="155" font-size="14" fill="#C17629" font-weight="bold" text-anchor="start">Pole B · what the system knows it does not know</text><text x="620" y="183" font-size="11" fill="#5D6572" font-weight="normal" text-anchor="start">Correct: uncertainty is explicit and resolved, held or escalated within finite capacity/time.</text><text x="620" y="212" font-size="11" fill="#C17629" font-weight="bold" text-anchor="start">Meridian: missing qualification creates repeated search, HOLD and escalation without bounded closure.</text><rect x="620" y="260" width="245" height="70" rx="8" fill="#FFFFFF" stroke="#C17629" stroke-width="1"/><text x="742.5" y="288" font-size="11.5" fill="#C17629" font-weight="bold" text-anchor="middle">I1 — in-window Type 1 determination loop</text><text x="742.5" y="309" font-size="10" fill="#5D6572" font-weight="normal" text-anchor="middle">failure position</text><rect x="880" y="260" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#C17629" stroke-width="1"/><text x="1000" y="288" font-size="11.5" fill="#1F2C4A" font-weight="bold" text-anchor="middle">Quality control / human escalation</text><text x="1000" y="309" font-size="10" fill="#5D6572" font-weight="normal" text-anchor="middle">primary business subsystem</text><rect x="60" y="385" width="540" height="235" rx="10" fill="#FBECEA" stroke="#B33A3A" stroke-width="1.5"/><text x="80" y="415" font-size="14" fill="#B33A3A" font-weight="bold" text-anchor="start">Pole C · what could potentially be learned or explored</text><text x="80" y="443" font-size="11" fill="#5D6572" font-weight="normal" text-anchor="start">Correct: possibilities remain hypotheses until brought into a qualified decision window.</text><text x="80" y="472" font-size="11" fill="#B33A3A" font-weight="bold" text-anchor="start">Meridian: creative possibilities become credible strategy before sufficient determination.</text><rect x="80" y="520" width="245" height="70" rx="8" fill="#FFFFFF" stroke="#B33A3A" stroke-width="1"/><text x="202.5" y="548" font-size="11.5" fill="#B33A3A" font-weight="bold" text-anchor="middle">O2 — out-of-window Type 2 possibility-to-fact collapse</text><text x="202.5" y="569" font-size="10" fill="#5D6572" font-weight="normal" text-anchor="middle">failure position</text><rect x="340" y="520" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#B33A3A" stroke-width="1"/><text x="460" y="548" font-size="11.5" fill="#1F2C4A" font-weight="bold" text-anchor="middle">Strategy / creativity</text><text x="460" y="569" font-size="10" fill="#5D6572" font-weight="normal" text-anchor="middle">primary business subsystem</text><rect x="600" y="385" width="540" height="235" rx="10" fill="#FFF4E9" stroke="#C17629" stroke-width="1.5"/><text x="620" y="415" font-size="14" fill="#C17629" font-weight="bold" text-anchor="start">Pole D · what no finite current window may presume to exhaust</text><text x="620" y="443" font-size="11" fill="#5D6572" font-weight="normal" text-anchor="start">Correct: structural residual is preserved while a bounded posture is still selected.</text><text x="620" y="472" font-size="11" fill="#C17629" font-weight="bold" text-anchor="start">Meridian: irreducible residual becomes veto, unlimited research or permanent escalation.</text><rect x="620" y="520" width="245" height="70" rx="8" fill="#FFFFFF" stroke="#C17629" stroke-width="1"/><text x="742.5" y="548" font-size="11.5" fill="#C17629" font-weight="bold" text-anchor="middle">O1 — out-of-window Type 1 expansion/paralysis</text><text x="742.5" y="569" font-size="10" fill="#5D6572" font-weight="normal" text-anchor="middle">failure position</text><rect x="880" y="520" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#C17629" stroke-width="1"/><text x="1000" y="548" font-size="11.5" fill="#1F2C4A" font-weight="bold" text-anchor="middle">Tactics / deployment / business development</text><text x="1000" y="569" font-size="10" fill="#5D6572" font-weight="normal" text-anchor="middle">primary business subsystem</text><rect x="40" y="650" width="1120" height="34" rx="7" fill="#1F2C4A" stroke="#1F2C4A" stroke-width="0"/><text x="600" y="672" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="middle">The four positions are simultaneous, domain-specific failures; caution in one room does not compensate for false closure in another.</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5D6572" stroke-width="1.6"/></marker></defs></svg>