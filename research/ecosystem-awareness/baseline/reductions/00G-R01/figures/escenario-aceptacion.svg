   <g id="text_1">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243b53" x="21.6" y="24.48" transform="rotate(-0 21.6 24.48)">From the practical problem to acceptance</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677a" x="21.6" y="46.8" transform="rotate(-0 21.6 46.8)">All rules, means and acceptance thresholds are declared before evaluation.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="194.4" y="91.15125" transform="rotate(-0 194.4 91.15125)">Problem parameters</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #243b53" transform="translate(111.47293 113.848304)">Task, obligations, routes M / I / P</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #243b53" transform="translate(79.021492 126.556009)">Distances, dispersion, segments, constraints</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="597.6" y="91.104375" transform="rotate(-0 597.6 91.104375)">Technology or combination</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #243b53" transform="translate(467.840922 113.848304)">Available means and effective parameter changes</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #243b53" transform="translate(475.722031 126.556009)">Information, review, coordination, costs, timing</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="396" y="196.23525" transform="rotate(-0 396 196.23525)">Operating scenario · θ</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="396" y="220.858156" transform="rotate(-0 396 220.858156)">Problem considered with the declared technological means</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="194.4" y="297.276375" transform="rotate(-0 194.4 297.276375)">Execution strategy · π</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #243b53" transform="translate(102.804031 321.496304)">What each agent or the group does</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #243b53" transform="translate(68.695742 334.204009)">Using only permitted information and operations</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="597.6" y="297.32325" transform="rotate(-0 597.6 297.32325)">Performance · (c, r, s)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #243b53" transform="translate(500.841961 321.496304)">Complete cost ceiling · campaign risk</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #243b53" transform="translate(514.249664 334.204009)">Probability of legitimate success</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="194.4" y="415.198125" transform="rotate(-0 194.4 415.198125)">Acceptance policies · (b, δ, p)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #243b53" transform="translate(89.859023 437.848304)">Maximum cost · maximum tolerated risk</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #243b53" transform="translate(121.058367 450.556009)">Minimum legitimate efficacy</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="597.6" y="415.104375" transform="rotate(-0 597.6 415.104375)">Compare with the accepted region</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="597.6" y="444.202156" transform="rotate(-0 597.6 444.202156)">c ≤ b     r ≤ δ     s ≥ p</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="504" y="524.80725" transform="rotate(-0 504 524.80725)">Inside</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="504" y="550.906156" transform="rotate(-0 504 550.906156)">This strategy is accepted</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="691.2" y="524.80725" transform="rotate(-0 691.2 524.80725)">Outside</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #243b53" x="691.2" y="550.906156" transform="rotate(-0 691.2 550.906156)">A threshold is unmet</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 11.3px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243b53" x="21.6" y="539.28" transform="rotate(-0 21.6 539.28)">Scenario-level conclusion</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(21.6 559.373109)">One accepted strategy establishes viability.</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #52677a" transform="translate(21.6 573.12)">One rejected strategy does not establish impossibility.</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677a" x="21.6" y="619.2" transform="rotate(-0 21.6 619.2)">Risk and efficacy are probabilities over executions; cost is a ceiling, not expected cost.</text>
   </g>
  </g>
 </g>
