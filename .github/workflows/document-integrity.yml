name: Documentation integrity

# Intentionally not triggered on every push.
# This repository is a high-churn research corpus; running the broad link checker
# on each documentation commit created repeated false-positive notification floods.
# Keep the check available for controlled review and pull requests.
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Document control verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check links, architecture sections and presentations
        run: python scripts/check_document_integrity.py
      - name: Check historical source qualifications and navigation
        run: |
          python -B -m unittest discover -s scripts -p test_historical_source_routes.py -v
          python -B scripts/test_document_navigation_literals.py
      - name: Check bounded ACC auxiliary model
        run: |
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/checks/check_preservation.py
          python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/economic-pilot-v0.1 -p test_model.py -v
      - name: Check parametric ACC economic toy (synthetic Stage A)
        run: python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/parametric-economic-toy-v0.1 -p test_toy.py -v

      - name: Check ACC rational resource traps, nonmonotone utility and relative gaps
        run: |
          python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/bounded-traps-v0.1 -p test_bounded_traps.py -v
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/bounded-traps-v0.1/bounded_traps.py > /tmp/acc_traps_results.json
          python -B -c "import json; from pathlib import Path; p=Path('research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/bounded-traps-v0.1/REFERENCE_SYNTHETIC_RESULTS.json'); assert json.loads(p.read_text()) == json.loads(Path('/tmp/acc_traps_results.json').read_text())"

      - name: Check ACC nested-systems structural gap and bounded information loss
        run: |
          python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/nested-composition-suffering-v0.1 -p test_nested_model.py -v
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/nested-composition-suffering-v0.1/nested_model.py > /tmp/acc_nested_model_results.json
          python -B -c "import json; from pathlib import Path; p=Path('research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/nested-composition-suffering-v0.1/REFERENCE_SYNTHETIC_RESULTS.json'); assert json.loads(p.read_text()) == json.loads(Path('/tmp/acc_nested_model_results.json').read_text())"

      - name: Check ACC endogenous A/B/C/D, source-native partial qualification and comprehension cost
        run: |
          python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/intrinsic-abcd-economics-v0.1 -p test_intrinsic_abcd.py -v
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/intrinsic-abcd-economics-v0.1/intrinsic_abcd.py > /tmp/acc_intrinsic_abcd_result.json
          python -B -c "import json; from pathlib import Path; p=Path('research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/intrinsic-abcd-economics-v0.1/REFERENCE_SYNTHETIC_RESULTS.json'); assert json.loads(p.read_text()) == json.loads(Path('/tmp/acc_intrinsic_abcd_result.json').read_text())"

      - name: Check ACC open qualified observations, local closure and bounded metacognition
        run: |
          python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/scoped-closure-metacognition-v0.1 -p test_metacognition.py -v
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/scoped-closure-metacognition-v0.1/metacognition.py > /tmp/acc_metacognition_result.json
          python -B -c "import json; from pathlib import Path; p=Path('research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/scoped-closure-metacognition-v0.1/REFERENCE_SYNTHETIC_RESULTS.json'); assert json.loads(p.read_text()) == json.loads(Path('/tmp/acc_metacognition_result.json').read_text())"

      - name: Check ACC rational persistence under characterized transition risk
        run: |
          python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/risk-aversion-persistence-v0.1 -p test_risk_model.py -v
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/risk-aversion-persistence-v0.1/risk_model.py > /tmp/acc_rav_risk_results.json
          python -B -c "import json; from pathlib import Path; p=Path('research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/risk-aversion-persistence-v0.1/REFERENCE_SYNTHETIC_RESULTS.json'); assert json.loads(p.read_text()) == json.loads(Path('/tmp/acc_rav_risk_results.json').read_text())"
          python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/risk-aversion-persistence-v0.1/experiments-from-escritos-v0.1 -p test_scenario_campaign.py -v
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/risk-aversion-persistence-v0.1/experiments-from-escritos-v0.1/scenario_campaign.py > /tmp/acc_rav_essay_experiments.json
          python -B -c "import json; from pathlib import Path; p=Path('research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/risk-aversion-persistence-v0.1/experiments-from-escritos-v0.1/REFERENCE_EXPERIMENT_RESULTS.json'); assert json.loads(p.read_text()) == json.loads(Path('/tmp/acc_rav_essay_experiments.json').read_text())"

      - name: Check 00M-ACC-UC21 scoped claim ladder (no new UC21 oracle)
        run: python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/00m-acc-uc21-bridge-v0.1 -p test_claim_ladder.py -v

      - name: Check Conscientia cross-document bounded campaign (synthetic only)
        run: |
          python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/conscientia-campaign-v0.1 -p test_campaign.py -v
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/conscientia-campaign-v0.1/verify_campaign.py /tmp/conscientia_full_execution.json

      - name: Publish reproducible Conscientia synthetic results
        uses: actions/upload-artifact@v4
        with:
          name: conscientia-acc-synthetic-results
          path: |
            /tmp/conscientia_full_execution.json
            /tmp/conscientia_full_execution.md
          if-no-files-found: error

      - name: Check optimum-derived HID and matched ABCD synthetic tests
        run: python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/parametric-economic-toy-v0.1 -p test_hid_optimum.py -v

      - name: Check Attribution Gap, Informational Friction and obligations bridge
        run: python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/causal-bridges-v0.1 -p test_bridge.py -v

      - name: Check UC21/DDS falsifiability bridge and favourable defence control
        run: |
          python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/parametric-economic-toy-v0.1/tests -p test_uc21_dds_bridge.py -v
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/parametric-economic-toy-v0.1/uc21_dds_bridge.py research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/parametric-economic-toy-v0.1/examples/uc21_s4_synthetic_defender.json --output /tmp/uc21_dds_synthetic_result.json
          python -B -c "import json; d=json.load(open('/tmp/uc21_dds_synthetic_result.json')); assert d['selected_intervention_prediction']=='SYNTHETIC_DEFENCE_NOT_EMPIRICAL_FALSIFICATION'; assert d['case_results'][2]['admitted_branch_defence']; assert d['uc21_hr_existential_six_case_conclusion']=='NOT_REFUTED_OR_PROVED_BY_NONEXHAUSTIVE_RUNS'; assert d['economic_projection']['mode']=='formulas'"

      - name: Check source-anchored ACC original examples, dimensions, rights and reachability
        run: |
          cp research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1/cases.json /tmp/acc_narrative_frozen_cases.json
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1/build_fixtures.py
          cmp research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1/cases.json /tmp/acc_narrative_frozen_cases.json
          python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1 -p 'test_*.py' -v
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1/engine.py --manifest research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1/cases.json --output /tmp/acc_original_narrative_results.json
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1/source_replay.py --output /tmp/acc_original_narrative_source_concordance.json
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1/mechanistic_replay.py --output /tmp/acc_original_narrative_operation_results.json
          python -B -c "import json; from pathlib import Path; p=Path('research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1/REFERENCE_RESULTS.json'); assert json.loads(p.read_text(encoding='utf-8'))==json.loads(Path('/tmp/acc_original_narrative_results.json').read_text(encoding='utf-8'))"

      - name: Check bounded source-native PR57 agentic analogues without changing original model
        run: |
          git fetch --depth=1 origin refs/heads/research/acc-agentic-ecosystem-reduction-v0.1-20261026
          test "$(git rev-parse FETCH_HEAD)" = "a98940490e8a84051ad314f2392c15338dbf1de9"
          mkdir -p /tmp/acc_pr57_pinned_source
          git show FETCH_HEAD:research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/agentic-ecosystem-reduction-v0.1/agentic_reduction.py > /tmp/acc_pr57_pinned_source/agentic_reduction.py
          git show FETCH_HEAD:research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/agentic-ecosystem-reduction-v0.1/CASES.json > /tmp/acc_pr57_pinned_source/CASES.json
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1/agentic_crosswalk.py --source-dir /tmp/acc_pr57_pinned_source --output /tmp/acc_original_narrative_agentic_crosswalk.json
          python -B -c "import json; d=json.load(open('/tmp/acc_original_narrative_agentic_crosswalk.json')); assert d['counts']=={'author_examples':14,'structural_analogues':8,'non_equivalent':6,'unique_native_agentic_cases_executed':5}; assert d['boundary'].startswith('STRUCTURAL_ANALOGIES_ONLY')"

      - name: Check joint compatibility of PR57, PR66 L-04, PR67 K-03 and PR69 without merging
        run: |
          git fetch --depth=1 origin refs/heads/research/acc-reusable-crossmodel-economic-envelope-20261028
          REV66="$(git rev-parse FETCH_HEAD)"
          test "$REV66" = "7c9043e0d035786297d4c04972e2fd5d2fa1138e"
          git fetch --depth=1 origin refs/heads/research/acc-source-native-private-response-k03-20261028
          REV67="$(git rev-parse FETCH_HEAD)"
          test "$REV67" = "078bf7fcdcc33811cbfa437b60e3f57d634dfd57"
          SOCIAL="research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/intrinsic-abcd-economics-v0.1"
          AGENT="research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/agentic-ecosystem-reduction-v0.1"
          mkdir -p "$AGENT"
          for file in economic_envelope.py economic_envelope_adapters.py economic_envelope_runner.py ECONOMIC_SWEEP_MANIFEST.json test_economic_envelope.py; do
            git show "$REV66:$SOCIAL/$file" > "$SOCIAL/$file"
          done
          for file in agentic_reduction.py CASES.json; do
            git show "$REV66:$AGENT/$file" > "$AGENT/$file"
          done
          for file in intrinsic_abcd.py test_native_selected_response.py; do
            git show "$REV67:$SOCIAL/$file" > "$SOCIAL/$file"
          done
          python -B -m unittest discover -s "$SOCIAL" -p 'test_*.py' -v
          python -B "$SOCIAL/economic_envelope_runner.py" --corpus-root . --model both > /tmp/acc_joint_crossmodel_compatibility.json
          python -B -m unittest discover -s research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1 -p 'test_*.py' -v
          python -B -c "import json; d=json.load(open('/tmp/acc_joint_crossmodel_compatibility.json')); assert d['summary']['groups']['ACC_SOCIAL_INTRINSIC_44']['cases']==168; assert d['summary']['groups']['ACC_AGENTIC_REDUCTION_57']['cases']==118; assert d['summary']['groups']['ACC_SOCIAL_INTRINSIC_44']['strict_wins'].get('B_QUALIFIED',0)>0; assert d['ranking_contract'].startswith('POLICIES_COMPETE')"

          git fetch --depth=1 origin refs/heads/research/acc-original-examples-generative-experiments-20261029
          REV68="$(git rev-parse FETCH_HEAD)"
          test "$REV68" = "583590dbadf48ea1015e33111b374631509015ae"
          OWNER="research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/conscientia-campaign-v0.1"
          for file in dimension_experiment.py native_experiment_adapters.py run_original_experiments.py ORIGINAL_EXPERIMENTS.json NATIVE_EXPERIMENTS.json; do
            git show "$REV68:$OWNER/$file" > "$OWNER/$file"
          done
          python -B "$OWNER/run_original_experiments.py" --model both --compact > /tmp/acc_owner68_full_source_execution.json
          python -B research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/studies/narrative-acceptance-v0.1/owner68_concordance.py --source-dir "$OWNER" --output /tmp/acc_owner68_independent_concordance.json
          python -B -c "import json; o=json.load(open('/tmp/acc_owner68_full_source_execution.json')); c=json.load(open('/tmp/acc_owner68_independent_concordance.json')); assert o['case_count']==73 and c['source_owner_case_count']==40 and c['operation_sequence_case_count']==14; assert len(c['shared_source_property_checks'])>=10; assert c['no_automatic_EA_THEORY_CHANGE']"

      - name: Publish original ACC narrative acceptance traces (synthetic only)
        uses: actions/upload-artifact@v4
        with:
          name: acc-original-examples-narrative-acceptance
          path: |
            /tmp/acc_original_narrative_results.json
            /tmp/acc_original_narrative_source_concordance.json
            /tmp/acc_original_narrative_operation_results.json
            /tmp/acc_original_narrative_agentic_crosswalk.json
            /tmp/acc_joint_crossmodel_compatibility.json
            /tmp/acc_owner68_full_source_execution.json
            /tmp/acc_owner68_independent_concordance.json
          if-no-files-found: error
