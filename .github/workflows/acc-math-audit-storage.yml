name: ACC mathematical audit storage integrity

on:
  pull_request:
    paths:
      - 'research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/review/incremental-audit-2026-10-26/math_audit_companion_2026-10-27.py'
      - 'research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/review/incremental-audit-2026-10-26/test_math_audit_storage.py'
      - 'research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/review/incremental-audit-2026-10-26/MATH_AUDIT_RESULTS_2026-10-27.json'
      - '.github/workflows/acc-math-audit-storage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathematical-audit-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test stdout, exclusive output, archive and temporary-file controls
        run: |
          S="research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/review/incremental-audit-2026-10-26"
          python -B -m unittest discover -s "$S" -p test_math_audit_storage.py -v
      - name: Replay original pinned mathematics without changing reference files
        run: |
          S="research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/review/incremental-audit-2026-10-26"
          python "$S/math_audit_companion_2026-10-27.py" > "$RUNNER_TEMP/acc_math_audit_storage_result.json"
          python -B -c "import json,os; from pathlib import Path; root=Path('research/ecosystem-awareness/baseline/01I-artifacts/acc-auxiliary-model-v0.1/review/incremental-audit-2026-10-26'); actual=json.loads((Path(os.environ['RUNNER_TEMP'])/'acc_math_audit_storage_result.json').read_text(encoding='utf-8')); expected=json.loads((root/'MATH_AUDIT_RESULTS_2026-10-27.json').read_text(encoding='utf-8')); assert actual==expected; assert actual['passed']==actual['total']==32; assert len(actual['sources_verified'])==4; print('Original 32/32 mathematical checks and all findings preserved; four source blobs verified')"
          test ! -e "$S/.pinned-math-audit-sources"
          test ! -e "$S/__pycache__"
          git diff --exit-code -- "$S/MATH_AUDIT_RESULTS_2026-10-27.json"
