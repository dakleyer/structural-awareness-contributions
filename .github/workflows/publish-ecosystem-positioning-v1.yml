name: Diagnose Ecosystem Positioning canonical deck

on:
  push:
    paths:
      - '.tmp/ecosystem-positioning-v1.0/READY2'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check python-pptx
      - name: Print canonical slide anchors
        shell: python
        run: |
          from pptx import Presentation
          p='presentations/ecosystem-positioning/Ecosystem_Positioning_Canonical.pptx'
          prs=Presentation(p)
          print('SLIDE_COUNT', len(prs.slides))
          for i, slide in enumerate(prs.slides, 1):
              texts=[getattr(sh,'text','').strip().replace('\n',' | ') for sh in slide.shapes if getattr(sh,'text','').strip()]
              print(f'SLIDE {i}:', ' || '.join(texts[:8]))
